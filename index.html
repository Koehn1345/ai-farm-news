<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriAI News</title>
<meta name="description" content="Latest news on AI in farming and agriculture">
<meta name="theme-color" content="#101a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgriAI News">
<style>
:root{
  --bg:#101a10; --bg-2:#162416; --card:#1b2d1b; --card-2:#223822;
  --ink:#e8f0e4; --ink-dim:#9db89a; --ink-faint:#6d8a6a;
  --accent:#7ed957; --accent-2:#c9f27e; --line:#2c452c;
  --danger:#ff7a45;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10;
  background:linear-gradient(180deg,var(--bg-2),rgba(22,36,22,.92));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.bar{display:flex; align-items:center; gap:10px}
h1{font-size:19px; margin:0; flex:1; letter-spacing:.2px}
h1 .leaf{color:var(--accent)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
#refreshBtn{
  width:38px; height:38px; border-radius:12px; background:var(--card);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:18px; color:var(--accent);
}
#refreshBtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#search{
  width:100%; margin-top:10px; padding:9px 12px; border-radius:12px;
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:15px; outline:none;
}
#search::placeholder{color:var(--ink-faint)}
.chips{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 13px; border-radius:999px; font-size:13.5px;
  background:var(--card); border:1px solid var(--line); color:var(--ink-dim);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#0c160c; font-weight:600}
#status{
  font-size:12.5px; color:var(--ink-faint); padding:8px 16px 0;
  display:flex; justify-content:space-between; gap:8px;
}
#status .err{color:var(--danger)}
main{padding:8px 12px 30px; max-width:680px; margin:0 auto}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:13px 14px; margin-top:10px; display:block;
}
.card a.title{
  color:var(--ink); text-decoration:none; font-weight:600; font-size:15.5px;
  display:block; line-height:1.35;
}
.card a.title:visited{color:var(--ink-dim)}
.meta{
  display:flex; align-items:center; gap:8px; margin-top:8px;
  font-size:12.5px; color:var(--ink-faint);
}
.src{
  color:var(--accent-2); background:rgba(126,217,87,.1);
  padding:2px 8px; border-radius:999px; max-width:50%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.meta .dot{opacity:.5}
.star{
  margin-left:auto; font-size:18px; line-height:1; padding:4px 2px;
  color:var(--ink-faint); flex:0 0 auto;
}
.star.on{color:#ffd24d}
.empty{
  text-align:center; color:var(--ink-faint); padding:48px 20px; font-size:14.5px;
}
.empty b{color:var(--ink-dim)}
.skel{height:74px; border-radius:14px; margin-top:10px;
  background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);
  background-size:200% 100%; animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
footer{text-align:center; color:var(--ink-faint); font-size:11.5px; padding:6px 20px 26px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><span class="leaf">🌾</span> AgriAI News</h1>
    <button id="refreshBtn" title="Refresh" aria-label="Refresh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
  <input id="search" type="search" placeholder="Filter… (e.g. See &amp; Spray, drone, herbicide)" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="day">Today</button>
    <button class="chip" data-f="week">This week</button>
    <button class="chip" data-f="saved">★ Saved</button>
  </div>
</header>
<div id="status"><span id="statusLeft"></span><span id="statusRight"></span></div>
<main id="list"></main>
<footer>Headlines via Google News · AI in chemical application &amp; weed control · tap a headline to read the full article</footer>

<script>
'use strict';
// ---- config -------------------------------------------------------------
const QUERIES = [
  'AI "weed control"',
  '"precision spraying" agriculture',
  '"See and Spray" OR "smart sprayer" OR "green-on-green"',
  'herbicide AI technology farming',
  '"spray drone" OR "drone spraying" agriculture',
  '"machine vision" OR "computer vision" weeds crops',
  'AI pesticide application agriculture',
  '"variable rate" spraying technology',
];
const FEED = q => 'https://news.google.com/rss/search?q=' +
  encodeURIComponent(q + ' when:30d') + '&hl=en-US&gl=US&ceid=US:en';
// CORS proxies, tried in order (Google News RSS doesn't send CORS headers)
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];
const CACHE_KEY = 'aifarm-articles-v2';
const SAVED_KEY = 'aifarm-saved-v1';

// ---- state --------------------------------------------------------------
let articles = [];                       // [{id,title,link,source,ts}]
let saved = load(SAVED_KEY, {});         // id -> article
let filter = 'all';
let query = '';

const $list = document.getElementById('list');
const $left = document.getElementById('statusLeft');
const $right = document.getElementById('statusRight');
const $btn = document.getElementById('refreshBtn');

function load(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb }catch{ return fb } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }

// ---- fetching -----------------------------------------------------------
async function fetchText(url){
  for(const wrap of PROXIES){
    try{
      const r = await fetch(wrap(url), {signal: AbortSignal.timeout(12000)});
      if(r.ok){
        const t = await r.text();
        if(t.includes('<rss') || t.includes('<item')) return t;
      }
    }catch{}
  }
  throw new Error('all proxies failed');
}

function parseFeed(xml){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  return [...doc.querySelectorAll('item')].map(it => {
    const get = t => it.querySelector(t)?.textContent?.trim() ?? '';
    let title = get('title');
    const source = get('source') || (title.match(/ - ([^-]+)$/)?.[1] ?? '');
    title = title.replace(/ - [^-]+$/, '');           // strip trailing " - Source"
    const link = get('link');
    const ts = Date.parse(get('pubDate')) || 0;
    const id = title.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().slice(0,90);
    return {id, title, link, source, ts};
  }).filter(a => a.title && a.link);
}

async function refresh(){
  $btn.classList.add('spin');
  $left.textContent = 'Fetching latest headlines…';
  $right.textContent = '';
  if(!articles.length) $list.innerHTML = '<div class="skel"></div>'.repeat(6);

  const results = await Promise.allSettled(QUERIES.map(q => fetchText(FEED(q)).then(parseFeed)));
  const ok = results.filter(r => r.status === 'fulfilled');
  const merged = new Map();
  for(const r of ok) for(const a of r.value) if(!merged.has(a.id)) merged.set(a.id, a);

  if(merged.size){
    articles = [...merged.values()].sort((a,b) => b.ts - a.ts);
    save(CACHE_KEY, {time: Date.now(), articles});
    $left.textContent = `${articles.length} articles · updated ${timeOfDay(Date.now())}`;
    if(ok.length < QUERIES.length) $right.innerHTML = '<span class="err">some sources timed out</span>';
  }else{
    $left.innerHTML = '<span class="err">Couldn’t reach the news feeds — check your connection and tap ↻</span>';
  }
  $btn.classList.remove('spin');
  render();
}

// ---- rendering ----------------------------------------------------------
function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if(s < 3600) return Math.max(1, s/60|0) + 'm ago';
  if(s < 86400) return (s/3600|0) + 'h ago';
  if(s < 86400*7) return (s/86400|0) + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function timeOfDay(ts){ return new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) }
function esc(s){ const d = document.createElement('span'); d.textContent = s; return d.innerHTML }

function visible(){
  const now = Date.now();
  let arr = filter === 'saved' ? Object.values(saved).sort((a,b)=>b.ts-a.ts) : articles;
  if(filter === 'day')  arr = arr.filter(a => now - a.ts < 86400e3);
  if(filter === 'week') arr = arr.filter(a => now - a.ts < 7*86400e3);
  if(query) arr = arr.filter(a => (a.title + ' ' + a.source).toLowerCase().includes(query));
  return arr;
}

function render(){
  const arr = visible();
  if(!arr.length){
    $list.innerHTML = `<div class="empty">${
      filter === 'saved' ? 'No saved articles yet.<br>Tap the <b>☆</b> on any story to keep it here.'
      : query ? `Nothing matches “<b>${esc(query)}</b>”.`
      : articles.length ? 'Nothing in this time range yet.'
      : 'Pull in some headlines with the <b>↻</b> button.'
    }</div>`;
    return;
  }
  $list.innerHTML = arr.map(a => `
    <div class="card">
      <a class="title" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
      <div class="meta">
        <span class="src">${esc(a.source || 'News')}</span>
        <span class="dot">·</span><span>${ago(a.ts)}</span>
        <button class="star ${saved[a.id] ? 'on' : ''}" data-id="${esc(a.id)}"
          aria-label="Save article">${saved[a.id] ? '★' : '☆'}</button>
      </div>
    </div>`).join('');
}

// ---- events -------------------------------------------------------------
$list.addEventListener('click', e => {
  const b = e.target.closest('.star'); if(!b) return;
  const id = b.dataset.id;
  if(saved[id]){ delete saved[id] }
  else{
    const a = articles.find(x => x.id === id) || Object.values(saved).find(x => x.id === id);
    if(a) saved[id] = a;
  }
  save(SAVED_KEY, saved);
  render();
});
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  filter = c.dataset.f;
  render();
});
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
$btn.addEventListener('click', refresh);

// ---- boot ---------------------------------------------------------------
const cached = load(CACHE_KEY, null);
if(cached?.articles?.length){
  articles = cached.articles;
  $left.textContent = `${articles.length} articles · cached ${ago(cached.time)}`;
  render();
}
refresh();
// auto-refresh when reopened after >15 min in background
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){
    const t = load(CACHE_KEY, {}).time || 0;
    if(Date.now() - t > 15*60e3) refresh();
  }
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
